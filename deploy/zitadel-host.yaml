apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-host
  namespace: gatekeeper
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        proxy_pass http://zitadel.gatekeeper.svc.cluster.local:8080;
        proxy_set_header Host localhost:8080;
        proxy_http_version 1.1;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-host
  namespace: gatekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel-host
  template:
    metadata:
      labels:
        app: zitadel-host
    spec:
      containers:
        - name: proxy
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: zitadel-host
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-host
  namespace: gatekeeper
spec:
  selector:
    app: zitadel-host
  ports:
    - port: 8080
      targetPort: 8080
