---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: member
  rules:
    - actions: ["create", "update", "delete", "read"]
      effect: EFFECT_ALLOW
      roles: ["admin", "Staff.Admin"]
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["support", "Staff.Support"]
