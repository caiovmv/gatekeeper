  Caching__ConnectionString: {{ .Values.segredo.cache | quote }}
  Files__AccessKey: {{ .Values.segredo.wasabiChave | default "" | quote }}
  Files__SecretKey: {{ .Values.segredo.wasabiSegredo | default "" | quote }}
