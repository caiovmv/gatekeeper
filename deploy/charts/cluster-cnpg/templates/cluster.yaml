apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  imageName: {{ .Values.imagem | quote }}
  storage:
    size: {{ .Values.armazenamento | quote }}
  bootstrap:
    initdb:
      database: gatekeeper
      owner: gatekeeper
      secret:
        name: postgres-gatekeeper
      postInitSQL:
        - CREATE ROLE temporal WITH LOGIN PASSWORD '{{ .Values.senhaTemporal }}'
        - CREATE DATABASE temporal OWNER temporal
        - CREATE DATABASE temporal_visibility OWNER temporal
        - CREATE ROLE zitadel WITH LOGIN PASSWORD '{{ .Values.senhaZitadel }}'
        - CREATE DATABASE zitadel OWNER zitadel
  monitoring:
    enablePodMonitor: false
