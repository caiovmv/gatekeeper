apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-banco
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "6"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: criar
          image: {{ .Values.imagemCliente | quote }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: SENHA
              value: {{ .Values.senhaZitadel | quote }}
          command:
            - sh
            - -c
            - |
              i=0
              while [ "$i" -lt 60 ]; do
                if pg_isready -h postgres-rw -p 5432 -U postgres; then
                  break
                fi
                i=$((i + 1))
                sleep 5
              done
              pg_isready -h postgres-rw -p 5432 -U postgres
              if ! psql -h postgres-rw -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='zitadel'" | grep -q 1; then
                psql -h postgres-rw -U postgres -d postgres -c "CREATE ROLE zitadel LOGIN PASSWORD '${SENHA}'"
              fi
              if ! psql -h postgres-rw -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='zitadel'" | grep -q 1; then
                psql -h postgres-rw -U postgres -d postgres -c "CREATE DATABASE zitadel OWNER zitadel"
              fi
