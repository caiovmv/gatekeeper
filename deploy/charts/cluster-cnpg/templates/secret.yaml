apiVersion: v1
kind: Secret
metadata:
  name: postgres-gatekeeper
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: kubernetes.io/basic-auth
stringData:
  username: gatekeeper
  password: {{ .Values.senhaAplicacao | quote }}
