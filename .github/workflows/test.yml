name: test

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentflowdemo-revamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Agent.slnx --nologo
